<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>離線 LINE 貼圖裁切工具</title>
<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#203044;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}header{background:#116a64;color:white;padding:24px 18px}header h1{margin:0 0 6px;font-size:clamp(24px,4vw,34px)}header p{margin:0;opacity:.9}.wrap{max-width:1100px;margin:22px auto;padding:0 16px}.panel{background:white;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 6px 24px #1a415015}h2{font-size:20px;margin:0 0 14px}.drop{display:block;border:2px dashed #87aaa8;border-radius:14px;text-align:center;padding:26px;cursor:pointer;background:#f6fbfa}.drop.drag{background:#d9f2ee}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}.toolbar label{display:flex;gap:8px;align-items:center}button,.btn{border:0;background:#116a64;color:white;border-radius:10px;padding:11px 16px;min-height:44px;font-size:15px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#e7eff0;color:#194e4a}button:focus-visible,input:focus-visible{outline:3px solid #e9a33b;outline-offset:2px}input[type=range]{accent-color:#116a64;max-width:160px}input[type=number]{width:76px;padding:9px;border:1px solid #b8c7d0;border-radius:8px}.editor{position:relative;display:inline-block;max-width:100%;touch-action:none;line-height:0;border-radius:10px;overflow:hidden;background:#ddd}.editor canvas{display:block;max-width:100%;height:auto}.crop{position:absolute;border:3px solid #f13c4b;box-shadow:0 0 0 9999px #0005;cursor:move;touch-action:none}.crop{pointer-events:auto}.crop.selected{border-color:#f13c4b}.crop:not(.selected){border-color:#17a6c1}.crop:not(.selected) .handle{display:none}.crop:after{content:"";position:absolute;inset:0;border:1px dashed #fff8}.handle{position:absolute;width:20px;height:20px;background:#fff;border:3px solid #f13c4b;border-radius:5px;z-index:2}.tl{top:-11px;left:-11px;cursor:nwse-resize}.tr{top:-11px;right:-11px;cursor:nesw-resize}.bl{bottom:-11px;left:-11px;cursor:nesw-resize}.br{bottom:-11px;right:-11px;cursor:nwse-resize}.work{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}.preview{flex:1;min-width:230px}.preview canvas{width:min(100%,260px);aspect-ratio:1;background:repeating-conic-gradient(#e8edf0 0 25%,#fff 0 50%) 50%/20px 20px;border:1px solid #cdd9df;border-radius:10px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}.tile{border:1px solid #dbe5e9;border-radius:12px;padding:10px;text-align:center}.tile img{width:100%;aspect-ratio:1;object-fit:contain;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 50%/16px 16px}.tile button{width:100%;margin-top:7px}.hint{color:#5b6d7a;font-size:14px;line-height:1.7}.status{color:#116a64;font-weight:650;min-height:24px}#file{position:absolute;width:1px;height:1px;opacity:0}footer{text-align:center;color:#60727a;padding:10px 20px 30px}@media(max-width:650px){.panel{padding:15px}.toolbar{align-items:stretch}.toolbar label{width:100%;justify-content:space-between}.toolbar input[type=range]{flex:1;max-width:none}.editor{width:100%}}
</style></head><body>
<header><div class="wrap" style="margin:0 auto"><h1>LINE 貼圖裁切工具</h1><p>單張裁切、九宮格批次裁切、PNG 下載｜完全離線處理</p></div></header>
<main class="wrap">
<section class="panel"><h2>① 上傳圖片</h2><label id="drop" class="drop" for="file">點擊選取或拖曳圖片到這裡<br><span class="hint">支援 PNG、JPG、WebP；圖片只在本機處理</span></label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><p class="status" id="status" aria-live="polite">尚未選擇圖片</p></section>
<section class="panel"><h2>② 調整裁切區域</h2><div class="toolbar"><button id="add" disabled>新增裁切框</button><button id="remove" class="secondary" disabled>刪除選取框</button><button id="multi" disabled>裁切全部圈選區域</button><button id="grid" disabled>一鍵裁切九宮格</button><button id="cut" disabled>裁切目前選取區域</button><button id="reset" class="secondary" disabled>重設裁切框</button><label>裁切框大小 <input id="size" type="range" min="5" max="100" value="30" disabled><output id="sizeText">30%</output></label></div>
<div class="work"><div id="editor" class="editor" hidden><canvas id="source"></canvas><div id="cropLayer" style="position:absolute;inset:0;pointer-events:none"></div></div><div class="preview"><h3>裁切預覽</h3><canvas id="preview" width="320" height="320"></canvas><p class="hint">按「新增裁切框」圈選多張；點選任一框後可拖曳移動、拉動四角調整大小。紅框為目前選取區域。</p></div></div></section>
<section class="panel"><h2>③ 下載貼圖</h2><div class="toolbar"><label>輸出尺寸 <select id="dimension" style="padding:10px;border-radius:9px;border:1px solid #c4d4d9"><option value="320">320 × 320</option><option value="370">370 × 370</option><option value="240">240 × 240</option><option value="512">512 × 512</option></select></label><button id="all" disabled>逐張下載全部</button><button id="clear" class="secondary" disabled>清除結果</button></div><p id="count" class="hint">目前沒有裁切結果</p><div id="gallery" class="gallery"></div></section>
</main><footer>純 HTML5 · 無須網路 · 不會上傳圖片至伺服器</footer>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),file=$('file'),drop=$('drop'),source=$('source'),ctx=source.getContext('2d'),preview=$('preview'),pctx=preview.getContext('2d'),editor=$('editor'),layer=$('cropLayer');
let img=null,rects=[],selected=-1,items=[],action=null;
const buttons=['grid','cut','reset','size','add','multi'];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function status(s){$('status').textContent=s}
function active(){return rects[selected]}
function updateControls(){buttons.forEach(id=>$(id).disabled=!img);$('remove').disabled=selected<0;$('all').disabled=$('clear').disabled=!items.length;$('count').textContent=items.length?`已產生 ${items.length} 張圖片`:'目前沒有裁切結果'}
function getScale(){return source.getBoundingClientRect().width/source.width}
function drawPreview(){pctx.clearRect(0,0,320,320);const r=active();if(r)pctx.drawImage(source,r.x,r.y,r.s,r.s,0,0,320,320)}
function renderRects(){layer.replaceChildren();const scale=getScale();rects.forEach((r,i)=>{const el=document.createElement('div');el.className='crop'+(i===selected?' selected':'');el.style.left=r.x*scale+'px';el.style.top=r.y*scale+'px';el.style.width=r.s*scale+'px';el.style.height=r.s*scale+'px';el.style.zIndex=i===selected?'10':'1';el.setAttribute('aria-label',`裁切框 ${i+1}`);el.dataset.index=i;for(const corner of ['tl','tr','bl','br']){const h=document.createElement('span');h.className='handle '+corner;h.dataset.corner=corner;el.append(h)}el.addEventListener('pointerdown',e=>{e.preventDefault();selected=i;const pos=getPos(e);action={pos,initial:{...rects[i]},corner:e.target.dataset.corner||null,id:e.pointerId,el};el.setPointerCapture(e.pointerId);updateRectPositions();drawPreview();updateControls()});el.addEventListener('pointermove',e=>{if(!action||action.id!==e.pointerId||action.el!==el)return;const p=getPos(e),dx=p.x-action.pos.x,dy=p.y-action.pos.y,r=action.initial,t=rects[i];if(!action.corner){t.x=clamp(r.x+dx,0,source.width-r.s);t.y=clamp(r.y+dy,0,source.height-r.s)}else{const c=action.corner,ax=c.includes('l')?r.x+r.s:r.x,ay=c.includes('t')?r.y+r.s:r.y,sx=c.includes('l')?-1:1,sy=c.includes('t')?-1:1;let size=Math.max(12,(sx*(p.x-ax)+sy*(p.y-ay))/2);size=Math.min(size,sx===1?source.width-ax:ax,sy===1?source.height-ay:ay);t.s=size;t.x=sx===1?ax:ax-size;t.y=sy===1?ay:ay-size}updateRectPositions();drawPreview()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>{if(action?.el===el){action=null;renderRects()}});layer.append(el)});updateRectPositions();drawPreview();const r=active();$('size').disabled=!r;if(r){$('size').value=Math.round(r.s/Math.min(source.width,source.height)*100);$('sizeText').textContent=$('size').value+'%'}else{$('sizeText').textContent='—'}updateControls()}
function updateRectPositions(){const scale=getScale();[...layer.children].forEach((el,i)=>{const r=rects[i];el.style.left=r.x*scale+'px';el.style.top=r.y*scale+'px';el.style.width=r.s*scale+'px';el.style.height=r.s*scale+'px';el.classList.toggle('selected',i===selected);el.style.zIndex=i===selected?'10':'1'})}
function addRect(){if(!img)return;const s=Math.min(source.width,source.height)/3,offset=(rects.length*23)%Math.max(24,Math.min(source.width,source.height)/3);rects.push({x:clamp((source.width-s)/2+offset,0,source.width-s),y:clamp((source.height-s)/2+offset,0,source.height-s),s});selected=rects.length-1;renderRects();status(`目前有 ${rects.length} 個圈選區域`)}
function reset(){if(!img)return;rects=[];selected=-1;addRect()}
function getPos(e){const b=source.getBoundingClientRect();return{x:(e.clientX-b.left)*source.width/b.width,y:(e.clientY-b.top)*source.height/b.height}}
function load(f){if(!f||!/^image\/(png|jpeg|webp)$/.test(f.type)){status('請選擇 PNG、JPG 或 WebP 圖片');return}const url=URL.createObjectURL(f),next=new Image();next.onload=()=>{URL.revokeObjectURL(url);img=next;source.width=img.naturalWidth;source.height=img.naturalHeight;ctx.drawImage(img,0,0);source.style.width=Math.min(620,editor.parentElement.clientWidth||620,source.width)+'px';editor.hidden=false;items=[];render();reset();status(`已載入 ${f.name}（${source.width} × ${source.height}）`)};next.onerror=()=>{URL.revokeObjectURL(url);status('圖片無法開啟')};next.src=url}
file.addEventListener('change',e=>load(e.target.files[0]));['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>load(e.dataTransfer.files[0]));
$('add').onclick=addRect;$('remove').onclick=()=>{if(selected<0)return;rects.splice(selected,1);selected=rects.length?Math.min(selected,rects.length-1):-1;renderRects()};$('reset').onclick=reset;
$('size').oninput=e=>{const r=active();if(!r)return;r.s=Math.min(source.width,source.height)*Number(e.target.value)/100;r.x=clamp(r.x,0,source.width-r.s);r.y=clamp(r.y,0,source.height-r.s);$('sizeText').textContent=e.target.value+'%';updateRectPositions();drawPreview()};
function createItem(x,y,w,h){const n=Number($('dimension').value),c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(source,x,y,w,h,0,0,n,n);items.push(c.toDataURL('image/png'))}
$('cut').onclick=()=>{const r=active();if(!r){status('請先新增或選取裁切框');return}createItem(r.x,r.y,r.s,r.s);render();status('已完成單張裁切')};
$('multi').onclick=()=>{if(!rects.length){status('請先新增裁切框');return}rects.forEach(r=>createItem(r.x,r.y,r.s,r.s));render();status(`已裁切 ${rects.length} 個圈選區域`)};
$('grid').onclick=()=>{if(!img)return;for(let row=0;row<3;row++)for(let col=0;col<3;col++)createItem(col*source.width/3,row*source.height/3,source.width/3,source.height/3);render();status('已完成九宮格裁切')};
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove()}
function render(){const gallery=$('gallery');gallery.replaceChildren();items.forEach((url,i)=>{const tile=document.createElement('div'),pic=document.createElement('img'),btn=document.createElement('button');tile.className='tile';pic.src=url;pic.alt=`貼圖 ${i+1}`;btn.textContent=`下載第 ${i+1} 張`;btn.onclick=()=>download(url,`sticker_${String(i+1).padStart(2,'0')}.png`);tile.append(pic,btn);gallery.append(tile)});updateControls()}
$('all').onclick=()=>{items.forEach((url,i)=>setTimeout(()=>download(url,`sticker_${String(i+1).padStart(2,'0')}.png`),i*250));status('已送出下載，瀏覽器可能詢問是否允許多檔下載')};
$('clear').onclick=()=>{items=[];render();status('已清除裁切結果')};$('dimension').onchange=()=>{if(items.length)status('新尺寸將套用於後續裁切，既有結果不變')};window.addEventListener('resize',()=>{if(img)updateRectPositions()});updateControls();
})();
</script></body></html>
